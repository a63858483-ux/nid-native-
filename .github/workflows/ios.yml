name: iOS build (unsigned)

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "dev = dev client that loads code from Metro; release = standalone app"
        type: choice
        options: [dev, release]
        default: dev

concurrency:
  group: ios-${{ inputs.kind }}
  cancel-in-progress: true

jobs:
  device:
    name: Device .ipa (${{ inputs.kind }})
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CONFIG: ${{ inputs.kind == 'release' && 'Release' || 'Debug' }}
    steps:
      - uses: actions/checkout@v5

      - name: Pick newest Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci --no-audit --no-fund --loglevel=http && exit 0
            echo "npm ci failed (attempt $i), retrying"; rm -rf node_modules; sleep 10
          done
          exit 1

      - name: Generate native project
        run: npx expo prebuild --platform ios --clean

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Nid.xcworkspace -scheme Nid \
            -configuration "$CONFIG" -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -80

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/${CONFIG}-iphoneos/Nid.app" Payload/
          zip -qry "Nid-${{ inputs.kind }}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Nid-${{ inputs.kind }}-ipa
          path: Nid-${{ inputs.kind }}.ipa
          retention-days: 14

  simulator:
    name: Simulator screenshots
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Pick newest Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci --no-audit --no-fund --loglevel=http && exit 0
            echo "npm ci failed (attempt $i), retrying"; rm -rf node_modules; sleep 10
          done
          exit 1

      - name: Generate native project
        run: npx expo prebuild --platform ios --clean

      - name: Build Release for simulator (demo data, no server)
        env:
          EXPO_PUBLIC_DEMO: "1"
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Nid.xcworkspace -scheme Nid \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -80

      - name: Run and screenshot
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for k,v in d.items() if 'iOS-26' in k for x in v if x['name'].startswith('iPhone 17 Pro') or x['name'].startswith('iPhone 16 Pro')];print(c[0]['udid'])")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Release-iphonesimulator/Nid.app
          mkdir -p shots
          for scene in chat sidebar model plus; do
            xcrun simctl terminate "$DEVICE" top.xiaoketata.nid.native || true
            xcrun simctl launch "$DEVICE" top.xiaoketata.nid.native -demoScene "$scene"
            sleep 14
            xcrun simctl io "$DEVICE" screenshot "shots/$scene.png"
          done
          xcrun simctl spawn "$DEVICE" log show --last 5m --style compact \
            --predicate 'process == "Nid"' > shots/device.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: shots/
          retention-days: 14
